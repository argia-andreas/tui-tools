<script>
// Presentation-only padding for these static terminal reference frames.
for (const pre of document.querySelectorAll('pre')) {
  const lines = pre.innerHTML.split('\n');
  const widthOf = line => { const el = document.createElement('span'); el.innerHTML = line; return [...el.textContent].length; };
  const width = Math.max(...lines.map(widthOf));
  pre.innerHTML = lines.map(line => {
    const rule = line.match(/─+([┐┤┘])$/);
    if (rule) { const prefix = line.slice(0, -rule[0].length); return prefix + '─'.repeat(width - widthOf(prefix) - 1) + rule[1]; }
    if (line.endsWith('│')) { const prefix = line.replace(/ *│$/, ''); return prefix + ' '.repeat(width - widthOf(prefix) - 1) + '│'; }
    return line;
  }).join('\n');
}
